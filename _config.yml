# ===== 基础信息 =====
title: 小雨田的博客
subtitle: 建筑企业信息化转型 · 数字赋能技术
description: 建筑企业信息化转型、数字赋能技术研究 | 小雨田的个人博客
url: "https://hyx.leipeng.us.kg"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
locale: zh-CN

# 文章永久链接（保留原结构，避免旧链接失效）
permalink: /:year/:month/:day/:title.html

# ===== 主题外观：light / dark =====
theme_mode: light

# ===== 社交链接（Chirpy 自动识别图标；请替换占位符）=====
social:
  name: leipengic
  email: leipengic@example.com
  links:
    - https://github.com/leipengic
    - https://space.bilibili.com/你的UID
    - https://weixin.qq.com/r/你的公众号二维码或主页

# ===== 分页 =====
paginate: 10
paginate_path: /page/:num/

# ===== Chirpy 需要的 tabs 集合（用于顶部导航）=====
collections:
  tabs:
    output: true

defaults:
  - scope:
      path: ""
      type: "tabs"
    values:
      layout: "page"
